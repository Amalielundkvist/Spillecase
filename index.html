<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkt Søgning</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
                <h1>Spilcafe</h1>
        </header>

        <main>
            <div class="search-container">
                <input type="search" id="search-input" placeholder="Søg efter produkter..." class="search-input">

                <select id="predefined-search" class="predefined-select">
                    <option value="">---- Sorter efter ----</option>
                    <option value="tid-stigende">Tid: Lav til høj</option>
                    <option value="tid-faldende">Tid: Høj til lav</option>
                </select>

                <button id="filter-toggle" class="filter-button">
                    <span>🔍 Filtrer</span>
                </button>
            </div>

            <div id="filter-panel" class="filter-panel">
                <div class="filter-header">
                    <h2>Filtrer Produkter</h2>
                    <button id="close-filter" class="close-button">&times;</button>
                </div>

                <div class="filter-content">
                    <div class="filter-group">
                        <label class="filter-label">Kategori</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Strategi"> Strategi
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Handel"> Handel
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Familie"> Familie
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Selskab"> Selskab
                            </label>
                             <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Rejse"> Rejse
                            </label>
                             <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Brætspil"> Brætspil
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Kortspil"> Kortspil
                            </label>
                        </div>
                    </div>
                    
                    
                    
                    <label class="filter-label">Tid</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="Tid" value="10-30 min"> 10-30 min
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="Tid" value="30-45 min"> 30-45 min
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="Tid" value="45-60 min"> 45-60 min
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="Tid" value="60-90 min"> 60-90 min
                            </label>
                        </div>

                    <label class="filter-label">Antal spillere</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="Antal spillere" value="1-3"> 1-3
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="Antal spillere" value="4-6"> 4-6
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="Antal spillere" value="6-8"> 6-8
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="Antal spillere" value="8-12"> 8-12
                            </label>
                        </div>


                        <label class="filter-label">Sværhedsgrad</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="Sværhedsgrad" value="Let"> Let
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="Sværhedsgrad" value="Middel"> Middel
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="Sværhedsgrad" value="Svær"> Svær
                            </label>
                        </div>

                        <label class="filter-label">Ledige spil</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="Ledige spil" value="Ledige spil"> Ledige spil
                            </label>
                    
                        </div>

                    </div>

                    

                        

                    
                <div class="filter-footer">
                    <button id="apply-filters" class="apply-button">Vis Produkter</button>
                </div>
            </div>

            <div id="products-container" class="products-container">
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Spilcafe</p>
        </footer>
    </div>

    <dialog id="product-dialog">
        <article class="dialog-content">
            <img id="dialog-image" src="" alt="" class="product-image">
            <h2 id="dialog-title"></h2>
            <p id="dialog-description"></p>
            <div class="product-meta">
                <span id="dialog-category" class="product-category"></span>
            </div>
            <div class="product-meta">
                <span id="dialog-price" class="product-price"></span>
            <div id="dialog-rating" class="product-rating"></div>
            <menu class="dialog-actions">
                <button id="dialog-close" value="cancel">Luk</button>
            </menu>
        </article>
    </dialog>

    <div id="overlay" class="overlay"></div>
    <script src="js/data.js"></script>
    <script src="js/scriptui.js"></script>
    <script src="js/scriptfilt.js"></script>
</body>

</html>
